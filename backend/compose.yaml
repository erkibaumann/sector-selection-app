# Keep the volume name independent of the checkout directory.
name: sector-selection

services:
  postgres:
    image: postgres:18
    # Defaults let the database start before composer creates .env.
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sector_selection}
      POSTGRES_USER: ${DB_USERNAME:-sector_selection}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sector_selection}
    ports:
      - "127.0.0.1:${DB_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Check the same authenticated TCP connection Laravel will use.
      test:
        [
          "CMD-SHELL",
          'PGPASSWORD=$$POSTGRES_PASSWORD psql -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB -qtAc "select 1" > /dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
